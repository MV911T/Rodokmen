<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rodokmen Veselých</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: Matěj at the top, ancestors descend by birth year (newest top, oldest bottom); year ruler pinned right; details in a dialog */
:root{
  --bg:#e9eef0; --surface:#ffffff; --ink:#18262e; --muted:#5b6b73; --rule:#c9d3d8; --grid:#dbe3e6;
  --accent:#a3362b;           /* red register ink */
  --link:#24506b;
  --l-vesely:#3f6e8c; --l-woron:#7a5c99; --l-chmielek:#a0577a; --l-pacik:#3d7d5c;
  --l-matusu:#8a7a2e; --l-struz:#a3612d; --l-jirik:#2f7a80; --l-opolony:#6b6f2f;
  --shadow:0 1px 2px rgba(24,38,46,.08),0 4px 14px rgba(24,38,46,.06);
  --f-name:"Spectral",Georgia,"Times New Roman",serif;
  --f-data:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171b; --surface:#1a232a; --ink:#e3eaed; --muted:#93a3ab; --rule:#2f3c44; --grid:#1f2a31;
  --accent:#e2735f; --link:#8cc0dd;
  --l-vesely:#7fb0d0; --l-woron:#b49ad4; --l-chmielek:#d68fb0; --l-pacik:#7fc29d;
  --l-matusu:#cdbb66; --l-struz:#e0a06a; --l-jirik:#6fc0c6; --l-opolony:#b3b86a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11171b; --surface:#1a232a; --ink:#e3eaed; --muted:#93a3ab; --rule:#2f3c44; --grid:#1f2a31;
  --accent:#e2735f; --link:#8cc0dd;
  --l-vesely:#7fb0d0; --l-woron:#b49ad4; --l-chmielek:#d68fb0; --l-pacik:#7fc29d;
  --l-matusu:#cdbb66; --l-struz:#e0a06a; --l-jirik:#6fc0c6; --l-opolony:#b3b86a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-data);margin:0;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
header h1{font-family:var(--f-name);font-weight:600;font-size:1.5rem;margin:0;text-wrap:balance}
header .meta{color:var(--muted);font-size:.8rem;letter-spacing:.02em}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.tools input{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);width:180px;max-width:46vw}
.tools button{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
.tools button:focus-visible,.tools input:focus-visible,.card:focus-visible,.chip:focus-visible,dialog button:focus-visible,.plink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--rule)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--ink);font:inherit;font-size:.75rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.certs{display:flex;gap:12px;align-items:center;margin-left:auto}
.cert{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.dot.M{background:var(--ink)} .dot.D{background:var(--muted);border-color:var(--muted)} .dot.R{background:transparent} .dot.K{background:transparent;border-style:dashed}

#scroller{flex:1;overflow:auto;position:relative;min-height:0}
#inner{display:flex;width:max-content;min-width:100%}
#canvas{position:relative;flex:none}
#ruler{position:sticky;right:0;flex:none;width:58px;background:var(--bg);border-left:1px solid var(--rule);z-index:3}
.tick{position:absolute;right:8px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.tick.century{color:var(--ink);font-weight:600}
.gridline{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.gridline.century{background:var(--rule)}
svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke:var(--rule);stroke-width:1.4}
svg.links path.hl{stroke:var(--accent);stroke-width:2}

.card{position:absolute;width:var(--cw);box-sizing:border-box;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:6px 8px 6px 8px;box-shadow:var(--shadow);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:opacity .15s,border-color .15s}
.card.K,.card.R{border-style:dashed}
.card .top{display:flex;align-items:flex-start;gap:6px}
.card .sw{margin-top:5px;flex:none}
.card .nm{font-family:var(--f-name);font-weight:600;font-size:.86rem;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .mn{font-size:.7rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .yr{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;margin-top:3px;font-size:.7rem;line-height:1.25;font-variant-numeric:tabular-nums}
.card .yr .dot{width:7px;height:7px;border-width:1.3px}
.card.root{border-color:var(--accent);border-width:2px}
.card.dim{opacity:.22}
.card.hit{border-color:var(--accent)}
.card:hover{border-color:var(--ink)}

dialog{border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:min(80vh,720px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,18,22,.45)}
.dlg{padding:18px 20px 20px;overflow:auto;max-height:inherit;box-sizing:border-box}
.dlg h2{font-family:var(--f-name);font-weight:600;font-size:1.35rem;margin:0;padding-right:36px;text-wrap:balance}
.dlg .sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.dlg .x{position:absolute;top:12px;right:12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:1rem}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;margin-top:8px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:16px 0 0;font-size:.9rem}
dl.facts dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
dl.facts dd{margin:0;min-width:0}
.plink{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.dlg h3{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px;font-weight:600}
.dlg ul{margin:0;padding-left:18px;font-size:.9rem;line-height:1.45}
.dlg li+li{margin-top:4px}
.src{font-size:.82rem;color:var(--muted)}
.scans{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scan{border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--bg);cursor:zoom-in;padding:0;font:inherit;color:inherit;text-align:left}
.scan img{display:block;width:100%;height:110px;object-fit:cover;object-position:top;filter:contrast(1.05)}
.scan span{display:block;font-size:.72rem;padding:5px 7px;color:var(--muted)}
#viewer{position:fixed;inset:0;background:rgba(8,12,15,.92);display:flex;flex-direction:column;z-index:20}
#viewer[hidden]{display:none}
#viewer .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#e6ecef;padding:10px 16px;font-size:.85rem}
#viewer .bar button{background:transparent;color:#e6ecef;border:1px solid #5a6b74;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
#viewer .pane{flex:1;overflow:auto;cursor:zoom-in}
#viewer .pane img{display:block;width:100%;height:auto;max-width:none}
#viewer .pane.fit img{width:auto;max-width:100%;max-height:100%;margin:auto}
#viewer .pane.fit{display:flex;cursor:zoom-in}

.tabs{display:flex;gap:4px}
.tabs button{font:inherit;font-size:.85rem;padding:6px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
#mapView{flex:1;overflow:auto;padding:16px;box-sizing:border-box}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;max-width:1300px;margin:0 auto}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}}
.mapfig{min-width:0}
#map{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
#map .grat{stroke:var(--grid);stroke-width:1;fill:none}
#map .glabel{fill:var(--muted);font-size:10px;font-family:var(--f-data)}
#map .route{fill:none;stroke-width:2.2;stroke-dasharray:6 4;opacity:.85}
#map .pt{stroke:var(--surface);stroke-width:2}
#map .lbl{font-family:var(--f-data);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
#map .sub{font-size:10px;fill:var(--muted)}
#map .country{font-family:var(--f-name);font-style:italic;font-size:15px;fill:var(--muted);opacity:.7;letter-spacing:.1em}
#map .hub{fill:var(--accent)}
.cap{font-size:.75rem;color:var(--muted);margin:6px 2px 0}
.story{display:flex;flex-direction:column;gap:18px;min-width:0}
.story article{border-left:3px solid var(--c);padding:2px 0 2px 14px}
.story h2{font-family:var(--f-name);font-size:1.1rem;margin:0 0 6px;font-weight:600;text-wrap:balance}
.story p{margin:0 0 8px;line-height:1.5;font-size:.92rem;max-width:65ch}
.tl{max-width:1300px;margin:24px auto 0}
.tl h3{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.tl ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tl li{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:.85rem;line-height:1.35}
.tl b{font-variant-numeric:tabular-nums;display:block;font-family:var(--f-name);font-size:1rem}
@media (max-width:520px){ header h1{font-size:1.25rem} .certs{margin-left:0} dl.facts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>

  { name: "Nedašova Lhota", lat: 49.135, lon: 18.09, line: "pacik", note: "Rod Pacík / Fojtík od 1712" },
  { name: "Nedašov", lat: 49.105, lon: 18.06, line: "matusu", note: "Rod Matůšů, Novák, Holba" },
  { name: "Chuchelná", lat: 50.00, lon: 18.03, line: "struz", note: "Rody Strusch, Opolony, Jiřík" },
  { name: "Bolatice", lat: 49.95, lon: 18.08, line: "jirik", note: "Rudolf Irzik *1882" }
];
window.RODOKMEN.story = [
  { line: "pacik", title: "Valašsko pod Bílými Karpaty – Pacíci a Matůšů",
    text: [
      "Nedašov a Nedašova Lhota leží na moravsko-slovenském pomezí pod Bílými Karpaty a patřily k panství Brumov. Nejstarší doložený předek, mlynář Tobiáš Pacík (*cca 1712, †1779), žil v domě č. 5, kde rod přebýval přes 150 let.",
      "V matrikách 18. století se stejná rodina psala jednou „Pacík“, jindy „Fojtík“ – příjmení se v té době teprve ustalovala. Zápisy jsou latinsky, v 19. století německy a od 70. let česky.",
      "Předkové byli domkáři, podsedníci a tkalci – drobní venkované bez větší půdy. Dědeček Rudolf (*1936) odešel jako mnoho Valachů za prací do průmyslové Ostravy."
    ] },
  { line: "struz", title: "Hlučínsko – Struž, Jiřík a Opoloný",
    text: [
      "Chuchelná a Bolatice leží na Hlučínsku. Po slezských válkách v roce 1742 připadlo Prusku, takže zdejší lidé byli 178 let pruskými (později německými) občany, i když mluvili moravským nářečím „po našymu“.",
      "Proto jsou jejich matriky od roku 1874 německé civilní (Standesamt Kuchelna) a jména se psala německy: Ernst Strusch, Rudolf Irzik, Marie Opolony.",
      "V roce 1920 bylo Hlučínsko připojeno k Československu, v roce 1938 k Německu a v roce 1945 znovu k ČSR. Muži jako Arnošt Struž proto za 2. světové války sloužili v německé armádě a po válce byli souzeni lidovými soudy."
    ] },
  { line: "woron", title: "Halič – Woroň, Włudyka, Chmielek a Dydowicz",
    text: [
      "Halič (polsky Galicja) byla v letech 1772–1918 korunní zemí Rakouska-Uherska – zhruba dnešní jižní Polsko a západní Ukrajina. Na přelomu 19. a 20. století patřila k nejchudším oblastem Evropy („galicyjska bieda“).",
      "Tisíce lidí proto odcházely za prací do ostravských dolů – byly ve stejné monarchii, takže se dalo volně stěhovat. Přesně tak přišli Ondřej Woroń z Lednice u Wieliczky, Markéta Włudyka z Rajbrotu, Stanislav Chmielek ze Zagórzan a Helena Dydowicz od Tarnova.",
      "Usadili se v hornické Polské Ostravě (od roku 1919 Slezská Ostrava), kde se jim v roce 1903 narodili Ludvík a Honorata – rodiče babičky Marty."
    ] },
  { line: "vesely", title: "Spiš – Veselí",
    text: [
      "Svatoň Veselý se narodil v roce 1933 v Kežmarku na Spiši. V letech 1918–1938 pracovaly na Slovensku tisíce Čechů ve státní službě (úředníci, železničáři, četníci, učitelé).",
      "Po vzniku Slovenského státu v roce 1939 museli většinou odejít do českých zemí. Poznámka „Uherský Brod 1940“ v rodinných papírech tomu odpovídá – zatím jde ale o hypotézu, kterou ověří rodný zápis z Kežmarku."
    ] }
];
window.RODOKMEN.timeline = [
  { y: 1712, t: "Narozen Tobiáš Pacík (Fojtík), nejstarší doložený předek" },
  { y: 1742, t: "Hlučínsko připadá Prusku" },
  { y: 1772, t: "Vzniká Halič jako součást habsburské monarchie" },
  { y: 1874, t: "V Prusku začínají civilní matriky (Standesamt)" },
  { y: 1896, t: "Woroňové a Chmielkové odcházejí z Haliče na Ostravsko (cca)" },
  { y: 1903, t: "V Polské Ostravě se rodí Ludvík Woroň a Honorata Chmielková" },
  { y: 1918, t: "Vzniká Československo, konec Haliče" },
  { y: 1920, t: "Hlučínsko připojeno k ČSR" },
  { y: 1933, t: "Svatoň Veselý se rodí v Kežmarku" },
  { y: 1938, t: "Hlučínsko připojeno k Německu" },
  { y: 1945, t: "Konec války, Hlučínsko znovu v ČSR" },
  { y: 1957, t: "Svatba Svatoně Veselého a Marty Woroňové ve Slezské Ostravě" },
  { y: 1985, t: "Svatba Radima Veselého a Jany Pacíkové" },
  { y: 1986, t: "Narozen Matěj Veselý" }
];

</script>
<script>
(function(){
const D = window.RODOKMEN, P = {}; D.people.forEach(p=>P[p.id]=p);
const CERT = {M:"Přečteno v matrice",D:"Jiný doklad (parte, rodný list, paměti)",R:"Rodinná tradice",K:"Kandidát – neověřeno"};
const lineVar = l => `var(--l-${l})`;
let zoom = 1, active = null;
try{ const z = parseFloat(localStorage.getItem('rv-zoom')); if(z>0.4&&z<2.6) zoom=z; }catch(e){}

// children index
const kids = {}; D.people.forEach(p=>[p.father,p.mother].forEach(x=>{ if(x&&P[x]) (kids[x]=kids[x]||[]).push(p.id); }));

// x layout: ancestors' leaves in DFS order (father first), child = mean of parents
const col = {}; let leaf = 0;
(function place(id){
  const p = P[id]; const ps = [p.father,p.mother].filter(x=>x&&P[x]);
  if(!ps.length){ col[id]=leaf++; return col[id]; }
  ps.forEach(place);
  col[id] = ps.reduce((s,x)=>s+col[x],0)/ps.length; return col[id];
})(D.root);
D.people.forEach(p=>{ if(col[p.id]===undefined) col[p.id]=leaf++; });

const years = D.people.map(p=>p.b.year);
const y0 = Math.floor((Math.min(...years)-6)/10)*10, y1 = 2000;
const age = (p)=>{ const a=p.b.year, b=(p.d&&p.d.year)||(p.alive?2026:null); return (a&&b&&!p.b.approx&&!(p.d&&p.d.approx))? (b-a) : null; };
const full = (e) => { if(!e) return ''; const m=(e.date||'').match(/^\s*(\d{1,2}\.\s*\d{1,2}\.\s*\d{4})/); return m? m[1].replace(/\s+/g,' ') : (e.approx?'~':'')+(e.year||'?'); };
const span = p => { const b=full(p.b); const d=p.d?full(p.d):(p.alive?'žije':''); return d? `${b} – ${d}` : `* ${b}`; };

function render(){
  const cw = Math.round(178*Math.min(zoom,1.25)), gap = Math.round(26*zoom), ppy = 7.2*zoom;
  const W = leaf*(cw+gap)+gap, H = (y1-y0)*ppy + 90;
  const cv = document.getElementById('canvas'), ru = document.getElementById('ruler');
  cv.style.width=W+'px'; cv.style.height=H+'px'; ru.style.height=H+'px'; cv.style.setProperty('--cw',cw+'px');
  cv.querySelectorAll('.card,.gridline').forEach(e=>e.remove()); ru.innerHTML='';
  for(let y=Math.ceil(y0/10)*10;y<=y1;y+=10){
    const g=document.createElement('div'); g.className='gridline'+(y%100===0?' century':''); g.style.top=((y1-y)*ppy)+'px'; cv.prepend(g);
    const t=document.createElement('div'); t.className='tick'+(y%100===0?' century':''); t.style.top=((y1-y)*ppy)+'px'; t.textContent=y; ru.appendChild(t);
  }
  const pos = {};
  D.people.forEach(p=>{
    const x = gap + col[p.id]*(cw+gap), y = (y1-p.b.year)*ppy;
    pos[p.id] = {x,y,cw};
    const c = document.createElement('button'); c.type='button';
    c.className = `card ${p.cert}` + (p.id===D.root?' root':'');
    c.style.left = x+'px'; c.style.top = (y-14)+'px'; c.dataset.id=p.id; c.dataset.line=p.line;
    c.setAttribute('aria-label', `${p.name}, ${span(p)}`);
    c.innerHTML = `<div class="top"><span class="sw" style="background:${lineVar(p.line)}"></span><div style="min-width:0"><div class="nm">${p.name}</div>${p.maiden?`<div class="mn">roz. ${p.maiden}</div>`:''}</div></div><div class="yr"><span>${span(p)}</span><span class="dot ${p.cert}" title="${CERT[p.cert]}"></span></div>`;
    c.addEventListener('click',()=>open(p.id));
    cv.appendChild(c);
  });
  // links
  const svg = document.getElementById('links'); svg.setAttribute('width',W); svg.setAttribute('height',H); svg.innerHTML='';
  D.people.forEach(p=>{
    const ch = pos[p.id]; const ps=[p.father,p.mother].filter(x=>x&&P[x]); if(!ps.length) return;
    const own = document.querySelector(`.card[data-id="${p.id}"]`);
    const cx = ch.x+cw/2, cy = ch.y-14 + (own?own.offsetHeight:56);
    ps.forEach(pid=>{
      const pp = pos[pid], px = pp.x+cw/2;
      const py = pp.y-14;
      const my = cy + Math.max(12,(py-cy)/2);
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M${cx},${cy} V${my} H${px} V${py}`); path.dataset.c=p.id; path.dataset.p=pid;
      svg.appendChild(path);
    });
  });
  applyFilter();
}

function applyFilter(){
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('dim', !!active && c.dataset.line!==active));
}

// chips
const chips = document.getElementById('chips');
Object.entries(D.lines).forEach(([k,label])=>{
  const n = D.people.filter(p=>p.line===k).length;
  const b=document.createElement('button'); b.type='button'; b.className='chip'; b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="sw" style="background:${lineVar(k)}"></span>${label} <span style="color:var(--muted)">${n}</span>`;
  b.addEventListener('click',()=>{ active = active===k?null:k; chips.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false')); if(active) b.setAttribute('aria-pressed','true'); applyFilter(); });
  chips.appendChild(b);
});

const nM = D.people.filter(p=>p.cert==='M').length;
const oldest = D.people.reduce((a,p)=>p.b.year<a.b.year?p:a);
document.getElementById('meta').textContent = `${D.people.length} osob · ${nM} doloženo přímo v matrikách · nejstarší předek ${oldest.name} (~${oldest.b.year}) · aktualizováno ${D.updated}`;

// dialog
const dlg = document.getElementById('dlg'), body = document.getElementById('dlgBody');
const link = id => P[id] ? `<button type="button" class="plink" data-go="${id}">${P[id].name}</button> <span class="src">${span(P[id])}</span>` : '';
function open(id){
  const p = P[id]; const a = age(p);
  const sp = D.people.filter(q=>(kids[q.id]||[]).some(k=>(kids[p.id]||[]).includes(k)) && q.id!==p.id);
  const rows = [];
  rows.push(['Narození', `${p.b.date||'?'}${p.b.place?', '+p.b.place:''}`]);
  if(p.d) rows.push(['Úmrtí', `${p.d.date}${p.d.place?', '+p.d.place:''}${a?` (${a} let)`:''}`]);
  else if(p.alive) rows.push(['Úmrtí', `žije${a?` (${a} let)`:''}`]);
  if(p.cause) rows.push(['Příčina úmrtí', p.cause]);
  if(p.occ) rows.push(['Povolání', p.occ]);
  if(p.marriage) rows.push(['Sňatek', p.marriage]);
  if(sp.length) rows.push(['Partner', sp.map(q=>link(q.id)).join('<br>')]);
  const par = [p.father,p.mother].filter(x=>x&&P[x]);
  if(par.length) rows.push(['Rodiče', par.map(link).join('<br>')]);
  if(kids[p.id]) rows.push(['Děti v rodokmenu', kids[p.id].map(link).join('<br>')]);
  body.innerHTML = `<button type="button" class="x" aria-label="Zavřít">×</button>
    <h2>${p.name}</h2>
    <div class="sub">${p.maiden?'roz. '+p.maiden+' · ':''}rod ${D.lines[p.line]}</div>
    <span class="badge"><span class="dot ${p.cert}"></span>${CERT[p.cert]}</span>
    <dl class="facts">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${p.notes&&p.notes.length?`<h3>Poznámky</h3><ul>${p.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}
    ${p.scans&&p.scans.length?`<h3>Zápisy v matrice</h3><div class="scans">${p.scans.map(s=>`<button type="button" class="scan" data-src="${s.f}" data-t="${s.t}"><img src="${s.f}" alt="${s.t}" loading="lazy"><span>${s.t}</span></button>`).join('')}</div>`:''}
    ${p.sources&&p.sources.length?`<h3>Prameny</h3><ul class="src">${p.sources.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}`;
  body.querySelector('.x').addEventListener('click',()=>dlg.close());
  body.querySelectorAll('.scan').forEach(b=>b.addEventListener('click',()=>showScan(b.dataset.src,b.dataset.t)));
  body.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{ focusCard(b.dataset.go); open(b.dataset.go); }));
  document.querySelectorAll('svg.links path').forEach(pa=>pa.classList.toggle('hl', pa.dataset.c===id||pa.dataset.p===id));
  if(!dlg.open) dlg.showModal();
}
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
const V=document.getElementById('viewer'), VP=document.getElementById('vp');
function showScan(src,t){ document.getElementById('vi').src=src; document.getElementById('vt').textContent=t; VP.classList.add('fit'); document.getElementById('vz').textContent='Přiblížit'; if(dlg.open) dlg.close(); V.hidden=false; }
function zoomScan(){ const f=VP.classList.toggle('fit'); document.getElementById('vz').textContent=f?'Přiblížit':'Oddálit'; }
document.getElementById('vz').addEventListener('click',zoomScan); VP.addEventListener('click',zoomScan);
document.getElementById('vx').addEventListener('click',()=>{ V.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !V.hidden) V.hidden=true; });

const sc = document.getElementById('scroller');
function focusCard(id){
  const c = document.querySelector(`.card[data-id="${id}"]`); if(!c) return;
  document.querySelectorAll('.card.hit').forEach(x=>x.classList.remove('hit')); c.classList.add('hit');
  sc.scrollTo({left: c.offsetLeft - sc.clientWidth/2 + c.offsetWidth/2, top: c.offsetTop - sc.clientHeight/2 + 30, behavior:'smooth'});
}
document.getElementById('q').addEventListener('input',e=>{
  const v = e.target.value.trim().toLowerCase(); if(v.length<2) return;
  const norm = s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const hit = D.people.find(p=>norm(p.name+' '+(p.maiden||'')).includes(norm(v))); if(hit) focusCard(hit.id);
});
function setZoom(z){ zoom=Math.max(.5,Math.min(2.4,z)); try{localStorage.setItem('rv-zoom',zoom)}catch(e){} render(); focusCard(D.root); }
document.getElementById('zin').addEventListener('click',()=>setZoom(zoom*1.2));
document.getElementById('zout').addEventListener('click',()=>setZoom(zoom/1.2));
document.getElementById('home').addEventListener('click',()=>focusCard(D.root));

render();
requestAnimationFrame(()=>{ const c=document.querySelector(`.card[data-id="${D.root}"]`); if(c) sc.scrollTo({left:c.offsetLeft-sc.clientWidth/2+c.offsetWidth/2, top:Math.max(0,c.offsetTop-60)}); });
})();

// ── map & story view ──
(function(){
  const D=window.RODOKMEN, svg=document.getElementById('map');
  const lat0=48.8, lat1=50.35, lon0=17.4, lon1=21.4, W=900, k=Math.cos(49.6*Math.PI/180);
  const H=Math.round(W*(lat1-lat0)/((lon1-lon0)*k));
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const X=lon=>(lon-lon0)/(lon1-lon0)*W, Y=lat=>(lat1-lat)/(lat1-lat0)*H;
  let g='';
  for(let a=Math.ceil(lat0*2)/2;a<=lat1;a+=.5) g+=`<line class="grat" x1="0" x2="${W}" y1="${Y(a)}" y2="${Y(a)}"/><text class="glabel" x="4" y="${Y(a)-3}">${a}° s. š.</text>`;
  for(let o=Math.ceil(lon0*2)/2;o<=lon1;o+=.5) g+=`<line class="grat" y1="0" y2="${H}" x1="${X(o)}" x2="${X(o)}"/><text class="glabel" x="${X(o)+3}" y="${H-4}">${o}° v. d.</text>`;
  g+=`<text class="country" x="${X(17.55)}" y="${Y(49.55)}">ČESKO</text><text class="country" x="${X(19.2)}" y="${Y(50.25)}">POLSKO</text><text class="country" x="${X(19.2)}" y="${Y(48.9)}">SLOVENSKO</text>`;
  const hub=D.places.find(p=>p.hub);
  D.places.filter(p=>!p.hub).forEach(p=>{
    const x1=X(p.lon),y1=Y(p.lat),x2=X(hub.lon),y2=Y(hub.lat), mx=(x1+x2)/2, my=(y1+y2)/2-Math.abs(x1-x2)*.12-20;
    g+=`<path class="route" stroke="var(--l-${p.line})" d="M${x1},${y1} Q${mx},${my} ${x2},${y2}"/>`;
  });
  D.places.forEach(p=>{
    const x=X(p.lon),y=Y(p.lat), right = p.lon<19 ? (p.name==='Nedašov'||p.name==='Bolatice') : false;
    const anchor = (p.lon<18.2 && !p.hub) ? 'end' : 'start', dx = anchor==='end'?-10:10;
    g+=`<circle class="pt ${p.hub?'hub':''}" cx="${x}" cy="${y}" r="${p.hub?9:6}" fill="${p.hub?'var(--accent)':'var(--l-'+p.line+')'}"><title>${p.name} – ${p.note}</title></circle>`;
    g+=`<text class="lbl" x="${x+dx}" y="${y+4}" text-anchor="${anchor}">${p.name}</text><text class="lbl sub" x="${x+dx}" y="${y+17}" text-anchor="${anchor}">${p.note}</text>`;
  });
  svg.innerHTML=g;
  document.getElementById('story').innerHTML=D.story.map(s=>`<article style="--c:var(--l-${s.line})"><h2>${s.title}</h2>${s.text.map(t=>`<p>${t}</p>`).join('')}</article>`).join('');
  document.getElementById('tl').innerHTML=D.timeline.map(e=>`<li><b>${e.y}</b>${e.t}</li>`).join('');
  const tT=document.getElementById('tabTree'), tM=document.getElementById('tabMap'), MV=document.getElementById('mapView'), SC=document.getElementById('scroller'), LG=document.querySelector('.legend'), TL=document.querySelector('.tools');
  function show(map){ MV.hidden=!map; SC.hidden=map; LG.hidden=map; TL.hidden=map; tT.setAttribute('aria-selected',!map); tM.setAttribute('aria-selected',map); try{localStorage.setItem('rv-tab',map?'map':'tree')}catch(e){} }
  tT.addEventListener('click',()=>show(false)); tM.addEventListener('click',()=>show(true));
  try{ if(localStorage.getItem('rv-tab')==='map') show(true); }catch(e){}
  if(location.hash==='#mapa') show(true);
})();
</script>
